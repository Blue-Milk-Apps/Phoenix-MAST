name: phoenix

services:
  # MobSF provider for static binary scanning of IPA and APK file types.
  mobsf-scanner:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: mobsf-scanner
    ports:
      - "8000:8000"
    environment:
      - MOBSF_API_KEY=${MOBSF_API_KEY:-phoenix-local-mobsf-api-key}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    attach: false

  # Gitleaks secret scanner
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    container_name: gitleaks
    volumes:
      - ${PROJECT_MOUNT_PATH:-.}:/workspace:ro
      - ${OUTPUT_PATH:-./scan-results}:/app/results
    command: [
      "dir",
      "${GITLEAKS_SCAN_PATH:-/workspace}",
      "--report-format",
      "json",
      "--report-path",
      "/app/results/gitleaks-report.json"
    ]

  # Primary Phoenix MAST Service.
  phoenix:
    image: phoenix:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: "1001:1001"
    container_name: phoenix
    volumes:
      - ${PROJECT_MOUNT_PATH:-.}:/workspace:ro
      - ${OUTPUT_PATH:-./scan-results}:/app/results
    environment:
      - CI=true
      - MOBSF_URL=
    command: ["scan", "${SCAN_FLAG:?Set SCAN_FLAG to one phoenix scan target flag}", "${PHOENIX_SCAN_PATH:?Set PHOENIX_SCAN_PATH to the scan path inside the container}", "--output", "/app/results"]


  phoenix-secrets:
    image: phoenix:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["secrets-only"]
    volumes:
      - ${PROJECT_MOUNT_PATH:-./sample-project}:/workspace:ro
      - ${OUTPUT_PATH:-./scan-results}:/app/results
    command: ["scan", "${SCAN_FLAG:?Set SCAN_FLAG to one phoenix scan target flag}", "${PHOENIX_SCAN_PATH:?Set PHOENIX_SCAN_PATH to the scan path inside the container}", "--output", "/app/results"]

networks:
  default:
    name: phoenix
