name: phoenix

services:
  # Gitleaks secret scanner
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    container_name: gitleaks
    profiles: ["tool-tests"]
    volumes:
      - ${PROJECT_MOUNT_PATH:-.}:/workspace:ro
      - ${OUTPUT_PATH:-./scan-results}:/app/results
    command: [
      "dir",
      "${GITLEAKS_SCAN_PATH:-/workspace}",
      "--report-format",
      "json",
      "--report-path",
      "/app/results/gitleaks-report.json"
    ]

  # Primary Phoenix MAST Service.
  phoenix:
    image: phoenix:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: "1001:1001"
    container_name: phoenix
    volumes:
      - ${PROJECT_MOUNT_PATH:-.}:/workspace:ro
      - ${OUTPUT_PATH:-./scan-results}:/app/results
      - ${RULES_PATH:-./rules}:/app/rules:ro
    environment:
      - CI=true
    # Defaults also let teardown commands parse this file.
    entrypoint: ["phoenix"]
    command: ["scan", "${SCAN_FLAG:---ios-source}", "${PHOENIX_SCAN_PATH:-/workspace}", "--output", "/app/results"]


networks:
  default:
    name: phoenix
