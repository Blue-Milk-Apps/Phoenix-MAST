[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix"
version = "0.1.0"
description = "All-in-one MobSec MAST tool for iOS and Android"
requires-python = ">=3.12"
dependencies = [
    "androguard>=4.1.3",
    "apkid==3.1.0",
    "jinja2>=3.1.6",
    "lief",
    "markupsafe>=3.0.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.15.15",
]

[project.scripts]
phoenix = "entrypoints.cli:main"

[tool.setuptools]
packages = [
    "adapters",
    "adapters.binary_scanners",
    "adapters.output",
    "adapters.output.phoenix_report",
    "adapters.post_scan",
    "adapters.storage",
    "adapters.source_code_scanners",
    "application",
    "domain",
    "domain.post_scan",
    "domain.post_scan.android",
    "domain.post_scan.ios",
    "entrypoints",
    "ports",
    "utilities",
]

[tool.setuptools.package-data]
"adapters.output.phoenix_report" = [
    "assets/*",
    "data/*",
    "docs/*",
    "schema/*",
    "templates/*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"adapters/output/phoenix_report/generate_report.py" = ["F841"]
